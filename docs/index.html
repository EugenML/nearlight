<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nearlight">
<meta name="theme-color" content="#000000">
<meta name="description" content="Ride the stardust at 0.999c. Follow the glittering thread, boost, and dive through wormholes into unknown galaxies.">
<title>Nearlight</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>

body{margin:0;background:#000}
a{color:#9fb0d8}a:hover{color:#dfe7ff}
.odo{display:inline-flex;align-items:flex-start;height:1em;line-height:1em;overflow:hidden;font-variant-numeric:tabular-nums}
.odc{display:inline-block;width:0.62em;height:1em;overflow:hidden;text-align:center;vertical-align:top}
.ods{display:block;will-change:transform}.ods span{display:block;height:1em;line-height:1em}
.odd{display:inline-block;width:0.42em;height:1em;line-height:1em;text-align:center;vertical-align:top}
@keyframes nl-coin{0%{transform:perspective(220px) rotateY(0)}100%{transform:perspective(220px) rotateY(720deg)}}
@keyframes nl-pop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (max-height: 520px){
.ic{width:860px!important;max-width:96vw!important;padding:12px 18px!important;gap:10px!important}
.ic-title{font-size:24px!important}.ic-sub{font-size:14px!important}
.ic-grid{gap:10px!important}.ic-card{padding:6px 6px!important;gap:4px!important}
.ic-card svg{width:112px!important;height:63px!important}
.ic-label{font-size:9.5px!important;letter-spacing:0.18em!important}
.ic-note{font-size:9px!important;letter-spacing:0.12em!important}
.ic-foot{padding-top:10px!important}.ic-ctrl svg{width:30px!important;height:30px!important}
.ic-start{min-height:40px!important;padding:0 22px!important}.ic-gc{min-height:36px!important;padding:0 14px!important}
}

@font-face { font-family: 'IBM Plex Mono'; font-weight: 300; src: url(fonts/IBMPlexMono-Light.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url(fonts/IBMPlexMono-Regular.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(fonts/IBMPlexMono-Medium.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Noto Sans JP'; font-weight: 300 400; src: url(fonts/NotoSansJP-subset.woff2) format('woff2'); font-display: swap; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
#app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
a { color: #9fb0d8; }
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div data-ref="{{rootRef}}" tabindex="0" style="position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; outline: none; font-family: 'IBM Plex Mono', 'Noto Sans JP', ui-monospace, monospace; color: #dfe7ff" data-on-mouse-move="{{hMove}}" data-on-mouse-down="{{hDown}}" data-on-mouse-up="{{hUp}}" data-on-mouse-leave="{{hLeave}}" data-on-key-down="{{hKeyDown}}" data-on-key-up="{{hKeyUp}}" data-on-focus="{{hFocus}}" data-on-blur="{{hBlur}}" aria-label="Lysfart. Click, then steer with the arrow keys or WASD, space to boost, P for autopilot.">
<canvas data-ref="{{canvasRef}}" role="img" aria-label="Cockpit view: stars, stardust, planets and wormholes" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"></canvas>
<sc-if value="{{showHud}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: calc(40px + env(safe-area-inset-left)); top: calc(34px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 4px; pointer-events: none">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #9fb0d8">{{speedLabel}}</div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 34px; font-weight: 400; color: {{speedColor}}">{{speed}}</span><span style="font-size: 16px; color: #9fb0d8">{{speedUnit}}</span></div>
<div style="font-size: 12px; letter-spacing: 0.08em; color: #9fb0d8">{{gammaText}}</div>
<div style="display: flex; align-items: baseline; gap: 7px; color: {{lyColor}}"><span style="font-size: 11px; letter-spacing: 0.12em; color: #9fb0d8">光年</span><span class="odo" data-ref="{{lyOdo}}" style="font-size: 17px"><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odd">.</span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span></span><span style="font-size: 11px; letter-spacing: 0.12em; color: #9fb0d8">LY</span></div>
<div style="font-size: 11px; letter-spacing: 0.08em; color: {{timeColor}}">{{timeText}}</div>
</div>
<div style="position: absolute; right: calc(40px + env(safe-area-inset-right)); top: calc(34px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #9fb0d8">銀河 · GALAXY {{galNo}}</div>
<div style="font-size: 18px; letter-spacing: 0.06em; color: #f2f5ff">{{galName}}</div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 10px; letter-spacing: 0.16em; color: #8f9fc6">{{galBestText}}</span><span data-ref="{{galClock}}" style="font-size: 13px; letter-spacing: 0.08em; color: #dfe7ff; font-variant-numeric: tabular-nums">0:00.0</span></div>
<div style="width: 132px; height: 3px; background: rgba(255,255,255,0.14); border-radius: 2px; overflow: hidden"><div style="height: 3px; width: {{galProg}}; background: #8fd3ff; border-radius: 2px"></div></div>
</div>
<sc-if value="{{noTouch}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: calc(40px + env(safe-area-inset-left)); bottom: calc(36px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; pointer-events: none">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #9fb0d8">FUEL {{fuelPct}}%</div>
<div style="width: 240px; height: 4px; background: rgba(255,255,255,0.14); border-radius: 2px; overflow: hidden">
<div style="height: 4px; width: {{fuelW}}; background: {{fuelColor}}; border-radius: 2px"></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none">
<div style="font-size: 12px; letter-spacing: 0.16em; color: #b9c6e6; text-shadow: 0 0 10px rgba(0,0,12,0.9)">{{hint}}</div>
</div>
<div style="position: absolute; right: calc(40px + env(safe-area-inset-right)); bottom: calc(36px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #dfe7ff">{{mode}}</div>
<div style="font-size: 10px; letter-spacing: 0.12em; color: #8f9fc6">← ↑ → ↓ / WASD STEER · SPACE BOOST · F PUSH METEOR · P AUTOPILOT · M MUSIC</div>
</div>
</sc-if>
<sc-if value="{{touch}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none">
<div style="font-size: 13px; letter-spacing: 0.16em; color: #b9c6e6">{{mode}} · {{hint}}</div>
</div>
<div style="position: absolute; left: calc(28px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #9fb0d8">FUEL {{fuelPct}}%</div>
<div style="width: 112px; height: 112px; border-radius: 56px; padding: 6px; box-sizing: border-box; background: conic-gradient({{fuelColor}} {{fuelDeg}}deg, rgba(255,255,255,0.14) 0deg)">
<button data-on-pointer-down="{{boostDown}}" data-on-pointer-up="{{boostUp}}" data-on-pointer-cancel="{{boostUp}}" data-on-pointer-leave="{{boostUp}}" data-on-context-menu="{{noMenu}}" aria-label="Boost: hold" style="width: 100px; height: 100px; border-radius: 50px; background: rgba(8,12,28,0.78); color: #dfe7ff; border: none; font-family: inherit; font-size: 13px; letter-spacing: 0.24em; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer">BOOST</button>
</div>
<sc-if value="{{pushShow}}" hint-placeholder-val="{{ false }}">
<button data-on-pointer-down="{{pushDown}}" data-on-context-menu="{{noMenu}}" aria-label="Push meteor: send a pulse that nudges it out of the lane" style="position: absolute; left: 126px; bottom: 12px; width: 88px; height: 88px; border-radius: 44px; padding: 0; background: {{pushBg}}; color: {{pushFg}}; border: 2px solid {{pushBorder}}; font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; line-height: 1.55; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer"><span style="display: block; pointer-events: none">{{pushL1}}</span><span style="display: block; pointer-events: none">{{pushL2}}</span></button>
</sc-if>
</div>
<div data-on-pointer-down="{{padDown}}" data-on-pointer-move="{{padMove}}" data-on-pointer-up="{{padUp}}" data-on-pointer-cancel="{{padUp}}" data-on-context-menu="{{noMenu}}" role="slider" aria-label="Steering pad: hold your thumb here and drag" aria-valuenow="{{padVal}}" style="position: absolute; right: calc(28px + env(safe-area-inset-right)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 150px; height: 150px; border-radius: 75px; background: rgba(8,12,28,0.5); border: 1px solid rgba(160,185,255,0.35); box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none">
<div style="position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: rgba(223,231,255,0.45)"></div>
<div style="position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 28px; background: rgba(143,211,255,0.28); border: 1px solid rgba(223,231,255,0.7); transform: translate({{kx}}px, {{ky}}px); pointer-events: none"></div>
</div>
</sc-if>
</sc-if>
<sc-if value="{{arrive}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none">
<div style="font-size: 13px; letter-spacing: 0.4em; color: #b9c6e6">未知の目的地 · GALAXY {{galNo}}</div>
<div style="font-size: 52px; font-weight: 300; letter-spacing: 0.12em; color: #ffffff">{{galName}}</div>
</div>
</sc-if>
<sc-if value="{{showSplit}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 96px; background: radial-gradient(closest-side, rgba(4,6,22,0.82), rgba(4,6,22,0.6) 55%, rgba(4,6,22,0)); text-shadow: 0 0 14px rgba(0,0,20,0.9)">
<div style="font-size: 13px; letter-spacing: 0.4em; color: #dfe7ff">{{splitTitle}}</div>
<div style="font-size: 52px; font-weight: 300; letter-spacing: 0.08em; color: #ffffff; font-variant-numeric: tabular-nums">{{splitTime}}</div>
<div style="font-size: 12px; letter-spacing: 0.24em; color: {{splitColor}}">{{splitDelta}}</div>
</div>
</div>
</sc-if>
<sc-if value="{{crashed}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none">
<div style="font-size: 13px; letter-spacing: 0.4em; color: #b9c6e6">{{crashKind}}</div>
<div data-ref="{{crashPop}}" style="display: flex; align-items: baseline; gap: 14px; font-size: 52px; font-weight: 300; color: #ffffff"><span class="odo" data-ref="{{crashOdo}}"><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span><span class="odd">.</span><span class="odc"><span class="ods"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span></span><span data-ref="{{crashUnit}}" style="display: inline-block; font-size: 30px; letter-spacing: 0.12em; color: #9fb0d8">LY</span></div>
<div style="font-size: 11px; letter-spacing: 0.24em; color: #9fb0d8">LIGHT-YEARS · BEST {{crashBestLy}} · FLIGHT TIME {{crashTime}}</div>
<sc-if value="{{hasRank}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #8fd3ff">{{crashRank}}</div>
</sc-if>
<div style="font-size: 11px; letter-spacing: 0.24em; color: #6f7fa6">RESTARTING · GALAXY 01</div>
</div>
</sc-if>
<sc-if value="{{showHelpBtn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: calc(30px + env(safe-area-inset-top)); display: flex; justify-content: center; gap: 10px; pointer-events: none">
<button data-on-click="{{exitRun}}" style="min-height: 44px; padding: 0 18px; background: rgba(8,12,28,0.6); color: #dfe7ff; border: 1px solid rgba(160,185,255,0.35); border-radius: 22px; font-family: inherit; font-size: 11px; letter-spacing: 0.24em; cursor: pointer; pointer-events: auto">{{exitLabel}}</button>
<sc-if value="{{gcOn}}" hint-placeholder-val="{{ false }}">
<button data-on-click="{{showBoard}}" style="min-height: 44px; padding: 0 18px; background: rgba(8,12,28,0.6); color: #dfe7ff; border: 1px solid rgba(160,185,255,0.35); border-radius: 22px; font-family: inherit; font-size: 11px; letter-spacing: 0.24em; cursor: pointer; pointer-events: auto">☆ TOP FLIGHTS</button>
</sc-if>
<button data-on-click="{{toggleSound}}" style="min-height: 44px; padding: 0 18px; background: rgba(8,12,28,0.6); color: #dfe7ff; border: 1px solid rgba(160,185,255,0.35); border-radius: 22px; font-family: inherit; font-size: 11px; letter-spacing: 0.24em; cursor: pointer; pointer-events: auto">{{soundLabel}} · M</button>
</div>
<button data-on-click="{{toggleAuto}}" aria-pressed="{{auto}}" style="position: absolute; right: calc(40px + env(safe-area-inset-right)); top: calc(112px + env(safe-area-inset-top)); min-height: 44px; padding: 0 18px; background: {{autoBg}}; color: {{autoFg}}; border: 1px solid rgba(160,185,255,0.45); border-radius: 22px; font-family: inherit; font-size: 11px; letter-spacing: 0.24em; cursor: pointer">{{autoLabel}} · P</button>
</sc-if>
<sc-if value="{{showIntro}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,8,0.55); cursor: default">
<div class="ic" style="width: 780px; max-width: 94vw; max-height: 94vh; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px 28px; background: rgba(8,12,28,0.92); border: 1px solid rgba(160,185,255,0.25); border-radius: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 16px"><div class="ic-title" style="font-size: 36px; font-weight: 300; letter-spacing: 0.14em; color: #ffffff">NEARLIGHT</div><div class="ic-sub" style="font-size: 20px; font-weight: 300; color: #9fb0d8">光速</div></div>
<div style="font-size: 11px; letter-spacing: 0.4em; color: #9fb0d8">HOW TO PLAY · 遊び方</div>
</div>
<div class="ic-grid" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<div class="ic-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border: 1px solid rgba(160,185,255,0.18); border-radius: 10px; color: #dfe7ff">
<svg viewBox="0 0 160 90" width="160" height="90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 70 C 40 20, 70 95, 154 28" stroke="#8fd3ff" stroke-width="2.5" stroke-dasharray="1.5 6"></path><circle cx="75" cy="57" r="13"></circle><path d="M75 37v6M75 71v6M55 57h6M89 57h6"></path><path d="M118 74h30M140 68l8 6-8 6" stroke="#9fb0d8"></path><rect x="12" y="8" width="44" height="9" rx="4.5" stroke="#9fb0d8"></rect><rect x="12" y="8" width="30" height="9" rx="4.5" fill="#8fd3ff" stroke="none"></rect><path d="M62 12.5h8M66 8.5v8" stroke="#8fd3ff"></path></svg>
<div class="ic-label" style="font-size: 11px; letter-spacing: 0.24em; text-align: center">FOLLOW THE STARDUST</div>
</div>
<div class="ic-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border: 1px solid rgba(160,185,255,0.18); border-radius: 10px; color: #dfe7ff">
<svg viewBox="0 0 160 90" width="160" height="90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 64 A 44 44 0 0 1 116 64" stroke="#9fb0d8"></path><path d="M30 52l5 2M40 36l4 4M56 26l2 5M72 22v6M88 26l-2 5M104 36l-4 4M114 52l-5 2" stroke="#9fb0d8"></path><path d="M72 64 L 104 38" stroke="#8fd3ff" stroke-width="3"></path><circle cx="72" cy="64" r="3" fill="#8fd3ff" stroke="none"></circle><text x="72" y="84" font-size="12" fill="#dfe7ff" stroke="none" text-anchor="middle" font-family="inherit">0.999 c</text><path d="M126 30l8 9-8 9M138 30l8 9-8 9" stroke="#8fd3ff"></path><rect x="122" y="62" width="30" height="8" rx="4" stroke="#9fb0d8"></rect><rect x="122" y="62" width="12" height="8" rx="4" fill="#ffb15c" stroke="none"></rect><path d="M137 76v8M133 80l4 4 4-4" stroke="#ffb15c"></path></svg>
<div class="ic-label" style="font-size: 11px; letter-spacing: 0.24em; text-align: center">FUEL = SPEED · BOOST BURNS FUEL</div>
</div>
<div class="ic-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border: 1px solid rgba(160,185,255,0.18); border-radius: 10px; color: #dfe7ff">
<svg viewBox="0 0 160 90" width="160" height="90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="104" cy="45" r="34" stroke="#dfe7ff" stroke-opacity="0.25" stroke-width="7"></circle><circle cx="104" cy="45" r="30" stroke="#dfe7ff" stroke-width="3"></circle><path d="M104 45c2-2 5 0 4 3s-5 4-8 2-4-8 0-11 11-3 14 2 2 13-4 16-16 3-19-4" stroke="#9fb0d8" stroke-width="1.5"></path><path d="M8 45h50M48 36l10 9-10 9" stroke="#8fd3ff"></path><circle cx="22" cy="45" r="7" stroke="#dfe7ff"></circle><path d="M148 12v10M143 17h10" stroke="#8fd3ff"></path><path d="M136 78v6M133 81h6" stroke="#8fd3ff"></path></svg>
<div class="ic-label" style="font-size: 11px; letter-spacing: 0.24em; text-align: center">FLY INTO THE RING</div>
</div>
</div>
<div class="ic-note" style="font-size: 10px; letter-spacing: 0.2em; color: #9fb0d8; text-align: center">光年 · LIGHT-YEARS ADD UP AS YOU FLY · THE CLOSER TO c, THE MORE · HIT A PLANET OR RUN DRY AND THE FLIGHT IS OVER</div>
<sc-if value="{{hasBest}}" hint-placeholder-val="{{ false }}">
<div class="ic-note" style="font-size: 10px; letter-spacing: 0.2em; color: #dfe7ff; text-align: center; margin-top: -8px">{{bestText}}</div>
</sc-if>
<sc-if value="{{gcOn}}" hint-placeholder-val="{{ false }}">
<div class="ic-note" style="font-size: 10px; letter-spacing: 0.2em; color: #8fd3ff; text-align: center; margin-top: -8px">{{gcMeText}}</div>
</sc-if>
<div class="ic-foot" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 22px; padding-top: 14px; border-top: 1px solid rgba(160,185,255,0.18)">
<sc-if value="{{noTouch}}" hint-placeholder-val="{{ true }}">

        let gr = ctx.createRadialGradient(CX, CY, 0, CX, CY, 400 * sc);
        gr.addColorStop(0, 'rgba(70,110,255,' + (0.07 * spd).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(70,110,255,0)');
        ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'multiply';
        gr = ctx.createRadialGradient(CX, CY, 380 * sc, CX, CY, 820 * sc);
        gr.addColorStop(0, 'rgb(255,255,255)'); gr.addColorStop(1, 'rgb(' + Math.round(255 - 60 * spd) + ',' + Math.round(255 - 95 * spd) + ',' + Math.round(255 - 110 * spd) + ')');
        ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
      }
      if (shimmer > 0) { ctx.globalCompositeOperation = 'screen'; const gr = ctx.createRadialGradient(CX, CY, 0, CX, CY, 700 * sc); gr.addColorStop(0, 'rgba(120,170,255,' + (0.35 * shimmer).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(120,170,255,0)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
      if (fog > 0) { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = rgba(fogCol, (0.25 * fog).toFixed(3)); ctx.fillRect(0, 0, W, H); }

      bloom(0.26);

      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.drawImage(vig, 0, 0, W, H);
      if (flash > 0) {
        const fa = Math.pow(Math.min(1, flash), 1.5);
        ctx.globalAlpha = fa; ctx.fillStyle = rgba(mix([255, 255, 255], hsl(gal.hue2, 70, 80), 0.25), 1); ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
      // engine dying: the cockpit lights flicker; crash: a hot flash (impact) or the lights going out (fuel), then black
      if (dying > 0 && !crash) {
        const fk = 0.5 + 0.5 * Math.sin(t * 31) * Math.sin(t * 9.3);
        ctx.globalAlpha = 0.3 * dying * fk; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      }
      if (crash) {
        const ct = crash.t;
        if (crash.kind === 'IMPACT') { const fl = smooth(0.45, 0, ct); if (fl > 0) { ctx.globalAlpha = fl; ctx.fillStyle = 'rgb(255,208,160)'; ctx.fillRect(0, 0, W, H); } }
        else { const fk = 0.5 + 0.5 * Math.sin(ct * 37) * Math.sin(ct * 11); ctx.globalAlpha = 0.35 * smooth(0, 0.6, ct) * fk; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
        ctx.globalAlpha = smooth(0.6, CRASH_CARD, ct); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      }
      if (fadeIn > 0) { ctx.globalAlpha = fadeIn; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

      // HUD
      hudT -= dt;
      if (hudT <= 0) {
        hudT = 0.15;
        let h = self._started && !self._focused ? 'CLICK THE SCREEN TO STEER' : 'FOLLOW THE STARDUST ◇';
        if (hint && hintT > 0) h = hint; else hint = '';
        if (centreK > 0.75 && manual) h = '中心 · DEAD CENTRE · FULL FEED ◇';
        if (!npKnown && manual && runT > 25 && objs.some((o) => o.t === 'planet' && !o.trap && o.zw - s > 250 && o.zw - s < 1100)) h = '接近 · SKIM THE EDGE OF A PLANET FOR A NEAR-PASS BONUS';
        if (self._started && !crash) { let n = 0; for (let i = 0; i < objs.length; i++) { const o = objs[i]; if (o.t === 'rock' && o.Rw >= 0.45 && o.zw - s > 30 && o.zw - s < 650) n++; } if (n >= 6) h = '流星群 · METEOR STORM · KEEP TO THE STARDUST'; }
        if (fuel < 0.25) h = 'FUEL LOW · FIND THE STARDUST ◇';
        if (sweep) { const ARR = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'], ai = ((Math.round(Math.atan2(sweep.dy, sweep.dx) / (Math.PI / 4)) % 8) + 8) % 8; h = s < sweep.z0 ? '旋回 · SWEEP AHEAD · GET READY TO LEAN ' + ARR[ai] : '旋回 · SWEEP · LEAN ' + ARR[ai] + ' AND HOLD'; }
        if (voidK > 0.3) h = '虚空 · VOID · LIGHT STEERING · EXTREME SPEED';
        if (worm && worm.zw - s < WORM_Z - 300) h = 'ワームホール · WORMHOLE AHEAD · FOLLOW THE STARDUST INTO THE RING';
        if (apMsgT > 0) h = 'AUTOPILOT OFF · YOUR TURN · FOLLOW THE STARDUST ◇';
        if (arriveT > 0 && galN >= 2 && !crash) h = galN === 3 ? '隕石 · METEORS RIDE THE STARDUST HERE · ' + (self._touch ? 'TAP PUSH METEOR' : 'PRESS F') + ' TO PUSH THEM ASIDE' : (galN === 4 ? '罠 · HERE THE STARDUST SOMETIMES RUNS INTO A PLANET · WATCH THE LINE' : '星屑 · THINNER STARDUST HERE · FUEL COMES SLOWER · BOOST WISELY');
        if (trapNear && trapNear.zw - s > 0 && trapNear.zw - s < 1000) h = '罠 · THE STARDUST RUNS INTO A PLANET · LEAVE THE LINE AND GO AROUND';
        if (dying > 0 && !crash) h = '燃料切れ · ENGINE DYING · FIND THE STARDUST ◇';
        if (self._started && !crash && manual && holdK < 0.6) h = self._touch ? '操縦 · HOLD THE STICK · THE SHIP IS DRIFTING OFF' : '操縦 · HANDS ON THE CONTROLS · THE SHIP IS DRIFTING OFF';
        if (meteor) {
          const m = meteor, tau = m.tau, tch = self._touch, pct = Math.round(clamp(m.off / MET_CLEAR, 0, 1) * 100);
          if (m.clear) h = '星屑 · STAY ON THE LINE · THE STARDUST KNOCKED OFF IT IS COMING';
          else if (tau < 1.3) h = '隕石 · NOT CLEAR · LEAVE THE LINE';
          else if (!m.n) h = '隕石 · METEOR ON THE LINE · ' + (tch ? 'TAP PUSH METEOR' : 'PRESS F') + ' TO PUSH IT ASIDE';
          else if (!onLine) h = 'パルス · WEAK PULSE · GET ON THE STARDUST FOR POWER';
          else h = 'パルス · PUSHED ' + pct + ' % · ' + (m.offT >= MET_CLEAR ? 'ALMOST CLEAR' : (m.cool <= 0 ? 'PUSH AGAIN' + (tch ? '' : ' (F)') : 'CHARGING')) + (centre < 0.5 && !tch ? ' · DEAD CENTRE PUSHES HARDEST' : '');
        }
        if (calloutT > 0 && !crash) h = callout;
        if (crash) h = crash.kind === 'FUEL' ? '燃料切れ · ENGINE OUT' : '衝突 · IMPACT';
        self.setState({ warp: false, split: null, push: meteor ? (meteor.clear ? 3 : (meteor.cool > 0 || meteor.offT >= MET_CLEAR ? 2 : 1)) : 0, galBest: getSplitBest(galN), galProg: clamp(gz / Math.max(1, wormAt - galS0), 0, 1), beta, fuel, gal: galN, name: gal.name, manual, boost: boosting, hint: h, arrive: arriveT > 0 && !crash, rt: runT, ly: runLy, bestLy, crash: crash ? { kind: crash.kind, time: crash.time, best: crash.best, ly: crash.ly, bestLy: crash.bestLy } : null, crashCard: !!crash && crash.t >= CRASH_CARD, auto: self._auto, apLeft: Math.ceil(self._apLeft), apCool: Math.ceil(self._apCool) });
        const mu = self._musicObj; if (mu) { mu.set('i', smooth(0.3, 0.98, beta)); mu.set('boost', boostK); mu.set('calm', voidK); mu.set('sweep', sweepK); mu.set('warp', false); mu.set('gal', galN); }
      }
    }
    self._raf = requestAnimationFrame(frame);
  }
}

(function () {
  const PROPS = Object.assign({}, {"autopilot": true, "music": true, "showHud": true, "startGalaxy": 1, "seed": 7}, { seed: 1 + Math.floor(Math.random() * 9999) });
  const tpl = document.getElementById('tpl'), frag = tpl.content.cloneNode(true);
  const comp = new Component(PROPS);
  let vals = null, pending = false;
  const textBinds = [], attrBinds = [], ifBinds = [], refs = [];
  const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g, ONE = /\{\{\s*([\w.$]+)\s*\}\}/;
  const get = (name) => name.split('.').reduce((o, k) => (o == null ? o : o[k]), vals);
  const fill = (t) => t.replace(HOLE, (_, k) => { const x = get(k); return x == null ? '' : String(x); });
  function walk(node) {
    if (node.nodeType === 3) { if (ONE.test(node.nodeValue)) textBinds.push({ node, t: node.nodeValue }); return; }
    if (node.nodeType !== 1) return;
    const el = node;
    if (el.tagName === 'SC-IF') { const m = ONE.exec(el.getAttribute('value') || ''); if (m) ifBinds.push({ el, name: m[1] }); el.removeAttribute('value'); el.removeAttribute('hint-placeholder-val'); el.style.display = 'none'; }
    for (const a of Array.from(el.attributes)) {
      const n = a.name, v = a.value;
      if (n.startsWith('data-on-')) { const ev = n.slice(8).replace(/-/g, ''); const m = ONE.exec(v); el.removeAttribute(n); if (m) { const hn = m[1]; el.addEventListener(ev, (e) => { const f = get(hn); if (typeof f === 'function') f(e); }); } continue; }
      if (n === 'data-ref') { const m = ONE.exec(v); el.removeAttribute(n); if (m) refs.push({ el, name: m[1] }); continue; }
      if (v.indexOf('{{') >= 0) attrBinds.push({ el, n, t: v });
    }
    for (const c of Array.from(el.childNodes)) walk(c);
  }
  for (const c of Array.from(frag.childNodes)) walk(c);
  function render() {
    pending = false; vals = comp.renderVals();
    for (let i = 0; i < textBinds.length; i++) { const b = textBinds[i], s = fill(b.t); if (b.node.nodeValue !== s) b.node.nodeValue = s; }
    for (let i = 0; i < attrBinds.length; i++) { const b = attrBinds[i], s = fill(b.t); if (b.el.getAttribute(b.n) !== s) b.el.setAttribute(b.n, s); }
    for (let i = 0; i < ifBinds.length; i++) { const b = ifBinds[i], d = get(b.name) ? 'contents' : 'none'; if (b.el.style.display !== d) b.el.style.display = d; }
  }
  comp.setState = function (s) { Object.assign(comp.state, s); if (!pending) { pending = true; requestAnimationFrame(render); } };
  comp.forceUpdate = function () { comp.setState({}); };
  render();
  document.getElementById('app').appendChild(frag);
  for (let i = 0; i < refs.length; i++) { const f = get(refs[i].name); if (typeof f === 'function') f(refs[i].el); }
  comp.componentDidMount();
  try { const C = window.Capacitor; if (C && C.Plugins && C.Plugins.StatusBar) C.Plugins.StatusBar.hide(); } catch (_) {}
  window.__game = comp;
})();
